<style>
  :root{
    --bg:#0a150f; --bg-2:#0d1c14;
    --panel:#0f2317; --panel-2:#12291b;
    --mask:#1c4d33; --trace:#3ddc84; --trace-dim:#2a9c61;
    --gold:#d4af37; --text:#e6f1ea; --muted:#7f9c8c;
    --danger:#e2725b; --radius:2px;
    
    /* Hiệu ứng siêu VIP */
    --glow-trace: rgba(61, 220, 132, 0.35);
    --glow-gold: rgba(212, 175, 55, 0.35);
    --ease-smooth: cubic-bezier(0.19, 1, 0.22, 1);
  }
  
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, #0f2317 0%, transparent 55%),
      radial-gradient(ellipse at bottom right, #0d2418 0%, transparent 50%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; background-attachment:fixed;
    overflow-x:hidden;
  }
  
  /* Nền lưới động (Digital Grid) */
  body::before{
    content:""; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(61,220,132,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,220,132,.06) 1px, transparent 1px);
    background-size:34px 34px; pointer-events:none; z-index:0;
    mask-image:radial-gradient(ellipse at 30% 0%, black 0%, transparent 70%);
    animation:gridMove 20s linear infinite;
  }
  @keyframes gridMove{
    0%{background-position:0 0;}
    100%{background-position:34px 34px;}
  }

  /* Các hạt bụi bay lơ lửng */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(61,220,132,.6), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(212,175,55,.6), transparent),
      radial-gradient(1.5px 1.5px at 60% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 50%, rgba(61,220,132,.6), transparent),
      radial-gradient(1.5px 1.5px at 10% 90%, rgba(212,175,55,.5), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,.4), transparent);
    animation:particlesFloat 15s ease-in-out infinite alternate;
    opacity:.8;
  }
  @keyframes particlesFloat{
    0%{transform:translateY(0px);}
    100%{transform:translateY(-60px);}
  }

  .wrap{position:relative; z-index:1; max-width:1320px; margin:0 auto; padding:0 40px 80px;}
  @media (max-width:900px){ .wrap{padding:0 20px 80px;} }
  code, .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--trace); outline-offset:2px;}

  /* ---------- TOGGLE NÚT GẠT ULTRA LIGHT ---------- */
  .toggle-wrap{
    display:flex; align-items:center; gap:10px; margin-left:auto;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    cursor:pointer; user-select:none;
  }
  .toggle-switch{
    position:relative; width:36px; height:20px; border-radius:20px;
    background:rgba(61,220,132,.2); border:1px solid rgba(61,220,132,.3);
    transition:background .3s ease, border-color .3s ease;
  }
  .toggle-switch::after{
    content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:var(--muted);
    transition:transform .3s var(--ease-smooth), background .3s ease;
  }
  .toggle-wrap.active .toggle-switch{
    background:rgba(61,220,132,.7); border-color:var(--trace);
  }
  .toggle-wrap.active .toggle-switch::after{
    transform:translateX(16px); background:#062012;
  }
  .toggle-wrap.active{color:var(--trace);}

  /* ---------- CHẾ ĐỘ ULTRA LIGHT (MÁY YẾU / LAG) ---------- */
  body.ultra-light{
    background: #0a150f;
  }
  body.ultra-light::before{
    animation:none; background-image:none;
  }
  body.ultra-light::after{
    animation:none; background-image:none;
  }
  body.ultra-light .card,
  body.ultra-light .feature,
  body.ultra-light .mf-panel,
  body.ultra-light .serial-panel,
  body.ultra-light .controls,
  body.ultra-light .guide,
  body.ultra-light .compat-banner{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    background: var(--panel) !important;
    box-shadow:none !important;
    transform:none !important;
    animation:none !important;
    transition:none !important;
  }
  body.ultra-light .card::before{
    animation:none !important;
    opacity:0 !important;
  }
  body.ultra-light .card .hole{
    border-color:var(--trace-dim); box-shadow:none; opacity:.6;
  }
  body.ultra-light .btn,
  body.ultra-light .tab,
  body.ultra-light .view-toggle button{
    transition:none !important;
    transform:none !important;
    box-shadow:none !important;
  }
  body.ultra-light .page-view.active{
    animation:none !important;
    transform:none;
    filter:none;
  }
  body.ultra-light .section-eyebrow::after{
    animation:none;
  }
  body.ultra-light .stat:hover b,
  body.ultra-light .card:hover .card-name{
    text-shadow:none;
    transform:none;
  }
  body.ultra-light .mf-progress-bar,
  body.ultra-light .mf-console > div,
  body.ultra-light .mf-led,
  body.ultra-light .serial-led,
  body.ultra-light .chip-mark .dot{
    animation:none !important;
  }
  body.ultra-light .toast{
    animation:none !important;
    transition:none !important;
  }

  /* ---------- manual flash panel ---------- */
  .mf-panel{
    margin-top:14px; background:var(--panel); border:1px solid rgba(61,220,132,.16); border-radius:var(--radius);
    padding:20px 22px 22px; transition:border-color .3s ease, box-shadow .3s ease, transform .3s var(--ease-smooth);
    backdrop-filter: blur(10px);
    background: rgba(15, 35, 23, .9);
  }
  .mf-panel.is-connected{border-color:rgba(61,220,132,.4); box-shadow:0 0 30px rgba(61,220,132,.05); transform:translateY(-2px);}

  /* device status bar — reads like a real hardware programmer's front panel */
  .mf-statusbar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px; padding-bottom:14px;
    border-bottom:1px dashed rgba(61,220,132,.16);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  }
  .mf-led{
    width:8px; height:8px; border-radius:50%; background:#ff0000;
    box-shadow:0 0 8px rgba(255,0,0,.9), inset 0 0 2px rgba(0,0,0,.3); flex-shrink:0;
    transition:background .4s ease, box-shadow .4s ease;
    animation:mf-led-pulse-red 1.4s ease-in-out infinite;
  }
  .mf-led.on{
    background:var(--trace); box-shadow:0 0 8px var(--trace), 0 0 2px var(--trace);
    animation:mf-led-pulse-green 2s ease-in-out infinite;
  }
  @keyframes mf-led-pulse-red{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes mf-led-pulse-green{0%,100%{opacity:1;}50%{opacity:.55;}}
